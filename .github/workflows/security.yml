name: security

# Advisory databases change daily, so these checks run on a schedule (and by hand) instead of on
# every pull request, where an unrelated new advisory would block a merge nobody can act on.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: security
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  LEFTHOOK: "0"

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env
        with:
          cache-scope: security
          tools: cargo-deny

      # Policy: .config/cargo/deny.toml (advisories, licences, bans, sources).
      - name: cargo-deny
        run: bun run rust:deny

      - name: npm advisories
        run: bun audit --audit-level=high
