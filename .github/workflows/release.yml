name: release

# Pushing a tag vX.Y.Z runs the full ci workflow (check, test, package), then creates a DRAFT
# GitHub release with the portable zips. Review the draft, then publish it by hand. The notes
# are .changes/releases/vX.Y.Z.md when that file has content, else GitHub's generated notes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 15
    # The only job in the repository that can write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the portable zips built by ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slatecore-launcher-portable
          path: release

      # The tag name is a value from the event: it stays in an environment variable.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s ".changes/releases/$TAG.md" ]; then
            notes=(--notes-file ".changes/releases/$TAG.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" release/*.zip --draft --verify-tag \
            --title "SLATECORE LAUNCHER $TAG" "${notes[@]}"
