# Bun only reads bunfig.toml from the directory it runs in, so this file stays at the root.
# https://bun.com/docs/runtime/bunfig

[install]
# Each workspace package only sees the dependencies it declares.
linker = "isolated"
# Pin exact versions (catalog versions are exact too).
exact = true

[run]
# Run scripts and `node` shebangs with bun: no Node.js runtime is required.
bun = true

[test]
# Not read when bun runs from a package directory: packages pass their own flags.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
