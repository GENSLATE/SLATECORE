  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#434c5e" stroke-width="4"/>
  <path d="M340 404L452 512L340 620" fill="none" stroke="#a3be8c" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 636H684" fill="none" stroke="#eceff4" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
