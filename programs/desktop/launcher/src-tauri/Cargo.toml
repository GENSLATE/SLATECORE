[package]
name = "genslate-launcher"
description = "SLATECORE LAUNCHER by GENSLATE: the portable app launcher (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "slatecore-launcher"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "genslate_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# The shipped file is `slatecore-launcher.exe`; the Cargo package keeps the GENSLATE namespace.
name = "slatecore-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
genslate-launcher-core.workspace = true
genslate-paths.workspace = true
genslate-vault.workspace = true
log.workspace = true
rfd.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["common-controls-v6"] }
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true
winreg.workspace = true

[dev-dependencies]
genslate-testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Used for its `serde` feature only: IPC commands deserialise passwords straight into `SecretString`.
ignored = ["secrecy"]
